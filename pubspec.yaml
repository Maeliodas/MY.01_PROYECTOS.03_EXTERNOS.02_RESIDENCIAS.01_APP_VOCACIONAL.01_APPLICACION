name: app_vocacional
description: Aplicación offline-first de orientación vocacional basada en RIASEC.
publish_to: "none"
version: 1.3.3+11

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  image_picker: ^1.1.2
  path: ^1.9.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
  assets:
    - assets/avatars/
    - assets/database/
    - assets/institution/
    - assets/branding/

flutter_launcher_icons:
  android: true
  image_path: "assets/branding/app_logo_light.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_logo_light.png"
  min_sdk_android: 21