publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  http: ^1.5.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
