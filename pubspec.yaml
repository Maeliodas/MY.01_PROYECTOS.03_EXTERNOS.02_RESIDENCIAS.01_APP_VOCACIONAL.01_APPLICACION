name: app_vocacional
description: "Aplicación vocacional offline-first para aspirantes del TecNM Tuxtepec"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestor de Estado
  flutter_riverpod: ^2.5.1

  # Navegación Declarativa
  go_router: ^13.2.0

  # Persistencia Local (Offline-first)
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Red y Utilidades
  http: ^1.2.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatars/
    - assets/icons/
    - assets/lottie/