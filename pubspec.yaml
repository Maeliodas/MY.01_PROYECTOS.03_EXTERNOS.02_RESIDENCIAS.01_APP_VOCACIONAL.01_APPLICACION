name: app_vocacional
description: Aplicación offline-first de orientación vocacional basada en RIASEC.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  connectivity_plus: ^6.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  image_picker: ^1.2.3
  intl: ^0.19.0
  path: ^1.9.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  image_cropper: ^8.0.3 # Opcional, o puedes usar un widget de recorte personalizado
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatars/
    - assets/icons/
    - assets/lottie/