name: app_vocacional
description: Aplicación móvil del proyecto de Residencias Profesionales.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  http: ^1.5.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatars/
    - assets/icons/
    - assets/lottie/
